services:
  # ==========================================
  # NutriGraph AI - FastAPI Backend Service
  # ==========================================
  - type: web
    name: nutrigraph-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutrigraph-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: 3.11.9

  # ==========================================
  # NutriGraph AI - Next.js Frontend Service
  # ==========================================
  - type: web
    name: nutrigraph-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nutrigraph-backend
          envVarKey: RENDER_EXTERNAL_URL
          property: host
      - key: NODE_VERSION
        value: 20.17.0

# ==========================================
# Managed PostgreSQL Database
# ==========================================
databases:
  - name: nutrigraph-db
    region: oregon
    plan: free
    databaseName: nutrigraph
    user: nutrigraph_user
